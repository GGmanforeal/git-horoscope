[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-horoscope"
version = "1.0.0"
description = "Real repository analytics (hotspots, bus factor, coupling, night-commit regret) delivered as a horoscope."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rahimjon Xasanov" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["git", "software-analytics", "hotspots", "bus-factor", "cli"]

[project.scripts]
git-horoscope = "githoroscope.__main__:cli"

[tool.setuptools]
packages = ["githoroscope"]
